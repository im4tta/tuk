<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tuk — paste, capture, keep</title>
<meta name="description" content="Tuk is a fast, local-first screenshot scratchpad. Paste, capture your screen at up to 4× resolution, caption, and export — all in your browser, nothing uploaded.">
<meta name="theme-color" content="#3652E0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161C" media="(prefers-color-scheme: dark)">
<script>
  // Apply any saved theme override before first paint, so there's no flash
  // of the wrong theme while main.js is still loading as a module.
  (function () {
    try {
      var t = localStorage.getItem('tuk-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* localStorage unavailable (private mode, etc.) — system theme stands */ }
  })();
</script>

<meta property="og:type" content="website">
<meta property="og:title" content="Tuk — paste, capture, keep">
<meta property="og:description" content="A fast, local-first screenshot scratchpad. Paste, capture your screen at up to 4× resolution, caption, and export — all in your browser, nothing uploaded.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Tuk — paste, capture, keep">
<meta name="twitter:description" content="A fast, local-first screenshot scratchpad. Paste, capture, caption, export — nothing ever leaves your browser.">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="toolbar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/><circle cx="8" cy="7" r="0.5" fill="white"/></svg>
      </div>
      Tuk
    </div>

    <button type="button" class="btn icon-btn" id="btnThemeToggle"></button>

    <span class="counts" id="counts" aria-live="polite">0 shots</span>
    <span class="storage-info" id="storageInfo"></span>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search captions & notes…" aria-label="Search captions and notes">
      <button type="button" class="search-clear hidden" id="btnClearSearch" title="Clear search" aria-label="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <select class="select" id="sortSelect" title="Sort order" aria-label="Sort order">
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
      <option value="largest">Largest file</option>
      <option value="name">Caption A–Z</option>
    </select>

    <button class="btn primary" id="btnAddPhoto" title="Pick screenshots from your photo library or files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
      Add photo
    </button>
    <input type="file" id="addPhotoInput" accept="image/*" hidden multiple>

    <div class="capture-group" id="captureGroup">
      <button class="btn" id="btnCapture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Capture screen
      </button>
      <select class="select" id="scaleSelect" title="Output resolution multiplier" aria-label="Output resolution multiplier">
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="4" selected>4× res</option>
      </select>
    </div>

    <button class="btn" id="btnPasteClipboard" title="Read an image from your system clipboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      Paste from clipboard
    </button>

    <label class="switch-wrap" title="Automatically copy every screen capture to your system clipboard so you can paste it elsewhere">
      <span class="switch"><input type="checkbox" id="toggleAutoCopy" checked><span class="switch-track"></span></span>
      Auto-copy captures
    </label>

    <button class="btn" id="btnSelectAll">Select all</button>
    <button class="btn" id="btnBulkCaption" disabled title="Set the same caption on every selected screenshot">Caption selected</button>
    <button class="btn" id="btnImportZip" title="Restore screenshots from a previously exported ZIP">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
      Import ZIP
    </button>
    <input type="file" id="importInput" accept=".zip" hidden multiple>
    <button class="btn" id="btnExportZip" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      Export selected
    </button>
    <button class="btn danger" id="btnDelete" disabled>Delete selected</button>
  </div>

  <main>
    <div class="dropzone" id="dropzone">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-5 5"/></svg>
      </div>
      <h2>Paste a screenshot to get started</h2>
      <p>Press <kbd>Ctrl</kbd>+<kbd>V</kbd> (or <kbd>⌘</kbd>+<kbd>V</kbd> on Mac) anywhere on this page, drag image files in, or click <strong>Capture screen</strong> above.</p>
    </div>

    <div class="grid hidden" id="grid"></div>
  </main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <button class="floating-paste" id="floatingPaste" title="Paste image from clipboard (Ctrl/⌘+V)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="2" width="8" height="4" rx="1"/>
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
      <path d="M12 11v6"/>
      <path d="M9 14l3-3 3 3"/>
    </svg>
  </button>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

name: Build macOS DMG for Clipa

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        brew install create-dmg
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6==6.6.0
        pip install pyperclip==1.8.2
        pip install pyinstaller==6.3.0
        # Install additional PyQt6 components that might be needed
        pip install PyQt6-Qt6==6.6.0 || echo "PyQt6-Qt6 not available"
    
    - name: Debug environment
      run: |
        echo "Python version:"
        python --version
        echo "Testing PyQt6 installation:"
        python -c "from PyQt6.QtCore import QT_VERSION_STR; print('PyQt6 Qt version:', QT_VERSION_STR)" || echo "PyQt6 import failed"
        echo "Files in directory:"
        ls -la
        echo "Testing basic imports:"
        python -c "import pyperclip; print('pyperclip: OK')" || echo "pyperclip: FAILED"
        python -c "from PyQt6.QtWidgets import QApplication; print('PyQt6.QtWidgets: OK')" || echo "PyQt6.QtWidgets: FAILED"
        python -c "from PyQt6.QtCore import Qt; print('PyQt6.QtCore: OK')" || echo "PyQt6.QtCore: FAILED"
    
    - name: Create simple PyInstaller spec
      run: |
        cat > Clipa.spec << 'EOF'
        # -*- mode: python ; coding: utf-8 -*-

        block_cipher = None

        a = Analysis(
            ['main.py'],
            pathex=[],
            binaries=[],
            datas=[('NotoSansKhmer.ttf', '.'), ('app_icon.png', '.')],
            hiddenimports=['PyQt6.QtCore', 'PyQt6.QtGui', 'PyQt6.QtWidgets'],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )

        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='Clipa',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon='app_icon.png',
        )

        app = BUNDLE(
            exe,
            name='Clipa.app',
            icon='app_icon.png',
            bundle_identifier='com.clipa.app',
        )
        EOF
    
    - name: Build with PyInstaller using spec
      run: |
        python -m PyInstaller Clipa.spec --clean --noconfirm
    
    - name: Verify build
      run: |
        echo "Build output:"
        ls -la dist/
        if [ -d "dist/Clipa.app" ]; then
          echo "✅ App bundle created successfully"
          echo "App bundle contents:"
          ls -la "dist/Clipa.app/Contents/"
        else
          echo "❌ App bundle not found"
          exit 1
        fi
    
    - name: Test app bundle
      run: |
        echo "Testing app bundle..."
        # Try to run the app briefly to see if it loads
        timeout 5s "dist/Clipa.app/Contents/MacOS/Clipa" --help || echo "App test completed (expected timeout)"
    
    - name: Create simple DMG
      run: |
        # Use hdiutil (more reliable than create-dmg)
        DMG_NAME="Clipa-macOS.dmg"
        rm -f "$DMG_NAME"
        
        # Create temporary directory
        mkdir -p temp_dmg
        cp -R "dist/Clipa.app" temp_dmg/
        ln -s /Applications temp_dmg/Applications
        
        # Create DMG
        hdiutil create -volname "Clipa" -srcfolder temp_dmg -ov -format UDZO "$DMG_NAME"
        
        # Cleanup
        rm -rf temp_dmg
        
        # Verify
        if [ -f "$DMG_NAME" ]; then
          echo "✅ DMG created: $(du -h "$DMG_NAME" | cut -f1)"
        else
          echo "❌ DMG creation failed"
          exit 1
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Clipa-macOS
        path: Clipa-macOS.dmg
    
    - name: Create release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: Clipa-macOS.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
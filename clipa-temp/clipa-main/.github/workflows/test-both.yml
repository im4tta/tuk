name: Test Clipa Build

on:
  workflow_dispatch:

jobs:
  test-full:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install PyQt6 pyperclip pyinstaller

    - name: Build Clipa
      run: |
        echo "Building Clipa..."
        pyinstaller --onefile --windowed --name=Clipa \
          --add-data="NotoSansKhmer.ttf:." \
          --add-data="app_icon.png:." \
          main.py
        ls -la dist/

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: Clipa-macOS-build
        path: dist/Clipa.app